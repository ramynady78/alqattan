<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="stripe" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="50" fill="#ffffff" opacity="0.18"/>
      <rect y="50" width="100" height="50" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="1500" fill="url(#g)"/>
  <rect x="90" y="110" width="1020" height="1280" rx="40" fill="#0b1020" opacity="0.55"/>
  <rect x="820" y="420" width="250" height="860" rx="26" fill="url(#stripe)" opacity="0.95"/>
  <rect x="820" y="420" width="250" height="860" rx="26" fill="#000000" opacity="0.18"/>

  <text x="140" y="260" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="58" fill="#ffffff" font-weight="900">
