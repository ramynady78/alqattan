<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="zebra" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="45" fill="#ffffff" opacity="0.18"/>
      <rect y="45" width="90" height="45" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="1500" fill="url(#g)"/>
  <rect x="90" y="110" width="1020" height="1280" rx="40" fill="#0b1020" opacity="0.55"/>
  <rect x="260" y="520" width="680" height="820" rx="28" fill="url(#zebra)"/>
  <text x="140" y="260" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="58" fill="#ffffff" font-weight="800">
    Zebra Blind Premium
  </text>
  <text x="140" y="330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" fill="#e0e7ff">
    Mock product image
  </text>
</svg>
