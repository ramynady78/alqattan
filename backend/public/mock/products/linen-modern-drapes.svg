      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="linen" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 H40" stroke="#ffffff" stroke-width="2" opacity="0.10"/>
