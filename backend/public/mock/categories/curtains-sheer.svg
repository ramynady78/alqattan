  </text>

  <g opacity="0.9">
    <rect x="820" y="220" width="80" height="470" rx="18" fill="url(#sheer)"/>
    <rect x="915" y="220" width="80" height="470" rx="18" fill="url(#sheer)"/>
    <rect x="1010" y="220" width="80" height="470" rx="18" fill="url(#sheer)"/>
  </g>
</svg>
