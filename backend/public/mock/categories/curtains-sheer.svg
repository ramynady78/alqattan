  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <rect x="80" y="80" width="1040" height="640" rx="32" fill="#0b1220" opacity="0.55"/>

  <text x="120" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="64" fill="#ffffff" font-weight="800">
